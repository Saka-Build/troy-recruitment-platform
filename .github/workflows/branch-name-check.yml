name: Check Branch Naming Convention

on:
  push:
    branches-ignore:
      - master
      - main

jobs:
  branch-naming-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|release|bugfix|hotfix)/ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow conventions."
            echo "Branch names must start with feature/, release/, bugfix/, or hotfix/."
            exit 1
          fi

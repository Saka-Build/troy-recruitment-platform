
name: Troy ATS - Build and Push Docker Image

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Build Spring Boot JAR
      - name: Build JAR
         working-directory: ./troy-ats
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image
      - name: Build Docker Image
          working-directory: ./troy-ats
        run: |
          docker build \
            -t troyats/troy-ats:latest \
            -t troyats/troy-ats:${{ github.sha }} .

      # 6. Push Docker images
      - name: Push Docker Image
        run: |
          docker push troyats/troy-ats:latest
          docker push troyats/troy-ats:${{ github.sha }}

      # 7. Deployment status
      - name: Build Summary
        run: |
          echo "Docker image successfully pushed."
          echo "Latest: troyats/troy-ats:latest"
          echo "Version: troyats/troy-ats:${{ github.sha }}"
          echo "EC2 deployment not performed."

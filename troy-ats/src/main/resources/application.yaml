spring:
  application:
    name: troy-ats

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379

  profiles:
    # Selects the RefreshTokenService impl: database | redis | test.
    # Has no matching application-*.yaml - it is a bean-selection profile only.
    active: database
    # Activating prod replaces `active`, so pull the token store back in
    # explicitly - AuthController has no RefreshTokenService bean without it.
    group:
      prod: database


  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  security:
    user:
      name: sakaadmin
      password: admin123

server:
  port: 8080

# Defaults are the Windows paths used when running from the IDE. In Docker the
# UPLOAD_* env vars in docker-compose.yml point these at the mounted volume -
# a C:/... path inside the Linux container would resolve relative to /app.
file:
  upload-original-cv-dir: ${UPLOAD_ORIGINAL_CV_DIR:C:/work/Docs-Troy-ats/upload/originalcv}
  upload-troy-cv-dir: ${UPLOAD_TROY_CV_DIR:C:/work/Docs-Troy-ats/upload/troycv}
  upload-photo-dir: ${UPLOAD_PHOTO_DIR:C:/work/Docs-Troy-ats/upload/employee/photo}

logging:
  level:
    root: INFO
    com.troy.ats: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO

app:
  logging:
    dir: ${LOG_DIR:logs}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 30
    refresh-ttl-days: 2

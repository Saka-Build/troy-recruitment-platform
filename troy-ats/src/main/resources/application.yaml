spring:
  application:
    name: troy-ats

  datasource:
    url: jdbc:postgresql://localhost:5432/troy_ats
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  security:
    user:
      name: sakaadmin
      password: admin123

server:
  port: 8080

